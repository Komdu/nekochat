[package]
name = "nekochat"
version = "0.11.0"
description = "Nekochat desktop client"
authors = ["Komdu"]
edition = "2021"

[lib]
name = "nekochat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
