# Фронт одного контейнера: пути разруливает nginx (не Cloudflare — там catch-all
# на :8000 и править его не нужно).
#   /nats  → nats-server :8081 (NATS поверх WSS-апгрейда)
#   всё    → uvicorn          :8001 (REST + собственный канал /ws)
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8000;
        server_name _;

        # NATS-транспорт (wss://host/nats): пробрасываем апгрейд на nats-server.
        # Только ТОЧНОЕ совпадение "= /nats": путь /nats/creds (REST-креды)
        # должен уходить в приложение, а не в nats-server.
        # Путь на апстрим убираем — nats-server отвечает на WS только на корне.
        location = /nats {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Всё остальное — приложение (uvicorn держит и REST, и свой /ws).
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # cloudflared шлёт X-Forwarded-Proto: https — прокид ываем дальше,
            # чтобы у uvicorn (proxy_headers) url/creds собирались как https.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 100m;
        }
    }
}