<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nekochat</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    /* ============ THEMES ============
       Стиль (Win98 / Material) задаётся через html[data-theme],
       режим (светлая / тёмная) — через html[data-mode].              */
    :root {  /* default: Win98, светлая */
      --face: #c0c0c0;      --light: #dfdfdf;  --face2: #d4d0c8;
      --shadow: #808080;    --dark: #404040;   --win-text: #000;
      --title1: #000080;    --title2: #1084d0; --desk: #008080;
      --on-title: #fff;     --panel: #fff;     --panel-hover: #ececf8;
      --text1: #000;        --muted: #555;     --divider: #d0d0d0;
      --focus: #fff8dc;     --link: #0000ee;   --err: #a00000;
      --mine: #cfdcf0;      --mine-sender: #003366;
      --chat-sub: #cfe0ff;  --ok: #006000;
    }
    html[data-theme="material"] {  /* Material (M3), светлая */
      --face: #f6f2fa;      --light: #ffffff;  --face2: #ece6f4;
      --shadow: #cac4d0;    --dark: #938f99;   --win-text: #1c1b1f;
      --title1: #6750a4;    --title2: #8b74c9; --desk: #e7e0ee;
      --panel: #fffbfe;     --panel-hover: #f0eaf8;
      --text1: #1c1b1f;     --muted: #625d66;  --divider: #e4e0e7;
      --focus: #e8def8;     --link: #6750a4;   --err: #b3261e;
      --mine: #e8dff8;      --mine-sender: #4f378b;
      --chat-sub: #d9cff2;  --ok: #2e7d32;
    }
    html[data-mode="dark"] {  /* Win98, тёмная */
      --face: #4b4b52;      --light: #6e6e78;  --face2: #3a3a41;
      --shadow: #232327;    --dark: #121214;   --win-text: #e8e8ec;
      --title1: #003e9c;    --title2: #0a6fc4; --desk: #08202b;
      --panel: #2a2a31;     --panel-hover: #34343c;
      --text1: #e8e8ec;     --muted: #a2a2ac;  --divider: #3d3d45;
      --focus: #3f3f4a;     --link: #8bb6ff;   --err: #ff8a8a;
      --mine: #2b3a55;      --mine-sender: #9cc3ff;
      --chat-sub: #a8c4e8;  --ok: #5fbf5f;
    }
    html[data-theme="material"][data-mode="dark"] {  /* Material (M3), тёмная */
      --face: #1d1b20;      --light: #211f26;  --face2: #141218;
      --shadow: #49454f;    --dark: #08070a;   --win-text: #e6e0e9;
      --title1: #4f378b;    --title2: #6750a4; --desk: #0f0e13;
      --panel: #211f26;     --panel-hover: #2b2930;
      --text1: #e6e0e9;     --muted: #cac4d0;  --divider: #36343b;
      --focus: #36343b;     --link: #d0bcff;   --err: #f2b8b5;
      --mine: #2b2540;      --mine-sender: #d0bcff;
      --chat-sub: #cfc2f0;  --ok: #81c784;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--desk);
      color: var(--win-text);
      font-family: 'Tahoma', 'MS Sans Serif', 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 16px; height: 16px; }
    ::-webkit-scrollbar-track { background: var(--face2); border-left: 1px solid var(--shadow); }
    ::-webkit-scrollbar-thumb { background: var(--face); border: 2px outset var(--light); }
    ::-webkit-scrollbar-thumb:hover { background: var(--face); }

    /* --- classic button --- */
    button {
      font-family: inherit; font-size: 12px; cursor: pointer;
      background: var(--face);
      color: var(--win-text);
      padding: 4px 14px;
      border-top: 2px solid var(--light);
      border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark);
      border-bottom: 2px solid var(--dark);
      border-radius: 0;
      outline: none;
    }
    button:active {
      border-top: 2px solid var(--dark);
      border-left: 2px solid var(--dark);
      border-right: 2px solid var(--light);
      border-bottom: 2px solid var(--light);
      padding-top: 5px; padding-left: 15px; padding-right: 13px; padding-bottom: 3px;
    }
    button:disabled { color: var(--shadow); border-color: var(--shadow); cursor: default; }

    /* --- classic input --- */
    input[type=text], input[type=password] {
      width: 100%;
      font-family: inherit; font-size: 12px; color: var(--win-text);
      background: var(--panel);
      border-top: 2px solid var(--dark);
      border-left: 2px solid var(--dark);
      border-right: 2px solid var(--light);
      border-bottom: 2px solid var(--light);
      padding: 4px 6px; margin-bottom: 12px;
      border-radius: 0; outline: none;
    }
    input:focus { background: var(--focus); }

    /* ============ AUTH WINDOW ============ */
    #auth { height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card {
      width: 340px; max-width: 92vw;
      background: var(--face);
      border-top: 2px solid var(--light); border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
      padding: 0;
      box-shadow: 4px 4px 0 rgba(0,0,0,.35);
    }
    .auth-card h1 {
      font-size: 13px; font-weight: bold; color: var(--on-title);
      background: linear-gradient(90deg, var(--title1), var(--title2));
      padding: 5px 8px; margin: 0;
      display: flex; align-items: center; justify-content: space-between;
      letter-spacing: .3px;
    }
    .auth-card h1::after { content: "✕"; font-size: 11px; }
    .auth-card .logo-wrap { padding: 16px 20px 4px; display: flex; justify-content: center; }
    .auth-card .logo-wrap img { width: 56px; height: 56px; border: 1px solid var(--shadow); background:var(--panel); padding:2px; }
    .auth-card .sub { color: var(--text1); margin: 4px 0 14px; font-size: 11px; text-align: center; }
    .auth-form { padding: 0 20px 6px; }
    .auth-form label { display: block; font-size: 11px; margin-bottom: 2px; }
    .auth-card .auth-actions { padding: 0 20px 14px; display: flex; gap: 6px; justify-content: flex-end; }
    .auth-switch { padding: 0 20px 14px; text-align: center; font-size: 11px; color: var(--text1); }
    .auth-switch a { color: var(--link); text-decoration: underline; cursor: pointer; }
    .err { color: var(--err); font-size: 11px; min-height: 16px; padding: 0 20px; }

    /* ============ APP / DESKTOP ============ */
    #app { display: none; height: calc(100vh - 28px); }
    .layout { display: flex; height: calc(100vh - 28px); }

    /* --- sidebar (left pane) --- */
    .sidebar {
      width: 300px; background: var(--face);
      display: flex; flex-direction: column; overflow: hidden;
      border-right: 3px groove var(--light);
    }
    .sidebar-header {
      padding: 6px 8px; background: var(--face);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--shadow);
    }
    .sidebar-header .logo { font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; color:var(--text1); }
    .sidebar-header .logo .logo-img { width: 26px; height: 26px; border: 1px solid var(--shadow); background:var(--panel); padding:1px; }
    .avatar {
      width: 30px; height: 30px;
      background: var(--title1); color:var(--on-title); font-weight: bold; font-size: 13px;
      border: 2px outset var(--face2); display:flex; align-items:center; justify-content:center;
      flex-shrink: 0; overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-sm { width: 26px; height: 26px; font-size: 11px; border-width: 2px; }
    #me-avatar { cursor: pointer; }
    #me-avatar:hover { background: var(--title2); }
    .msg-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .msg .msg-avatar {
      width: 20px; height: 20px; flex-shrink: 0;
      background: var(--title1); color: var(--on-title); font-size: 10px; font-weight: bold;
      border: 1px outset var(--face2); display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .msg .msg-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .user-box { display: flex; align-items: center; gap: 8px; }
    .user-box .name { font-weight: bold; font-size: 12px; color:var(--text1); }
    .tabs { display: flex; gap: 4px; padding: 4px 6px; background: var(--face); border-bottom: 1px solid var(--shadow); }
    .tab {
      flex: 1; padding: 4px 8px; text-align: center; font-size: 12px; color: var(--text1);
      background: var(--face);
      border-top: 2px solid var(--light); border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
      cursor: pointer;
    }
    .tab:active { border: 2px solid var(--dark); }
    .tab.active {
      background: var(--face);
      border-top: 2px solid var(--dark); border-left: 2px solid var(--dark);
      border-right: 2px solid var(--light); border-bottom: 2px solid var(--light);
      font-weight: bold;
    }
    .search { padding: 6px; }
    .search input { margin-bottom: 0; }
    .list { flex: 1; overflow-y: auto; background: var(--panel); border-top: 2px inset var(--face2); border-bottom: 2px inset var(--face2); }
    .list-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer;
      border-bottom: 1px solid var(--divider); background: var(--panel); color: var(--text1);
    }
    .list-item:hover { background: var(--panel-hover); }
    .list-item.active { background: var(--title1); color: var(--on-title); }
    .list-item.active .title, .list-item.active .meta { color: var(--on-title); }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .title { font-size: 12px; color:var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .meta { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .online-dot { width: 10px; height: 10px; border: 1px solid var(--light); background: var(--shadow); flex-shrink: 0; border-radius: 0; }
    .online-dot.online { background: #00a000; }
    .empty { color: var(--muted); text-align: center; padding: 30px 16px; font-size: 12px; }
    .add-btn { font-size: 15px; line-height: 1; padding: 3px 10px; margin: 6px; margin-top: 8px; align-self: flex-start; font-weight: bold; }

    /* --- chat window --- */
    .chat { flex: 1; display: flex; flex-direction: column; background: var(--face); }
    .chat-header {
      padding: 6px 10px; color:var(--on-title);
      background: linear-gradient(90deg, var(--title1), var(--title2));
      border-top: 2px outset var(--light); border-left: 2px outset var(--light);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header .title { font-weight: bold; font-size: 13px; color:var(--on-title); }
    .chat-header .sub { color: var(--chat-sub); font-size: 11px; }
    .messages {
      flex: 1; overflow-y: auto; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 4px;
      background: var(--face2);
    }
    .msg {
      max-width: 70%; padding: 5px 8px; margin-bottom: 6px;
      display: flex; flex-direction: column; gap: 2px; word-wrap: break-word;
      font-size: 12px; color: var(--text1);
      border-top: 2px solid var(--light); border-left: 2px solid var(--light);
      border-right: 2px solid var(--shadow); border-bottom: 2px solid var(--shadow);
    }
    .msg .sender { font-size: 11px; font-weight: bold; color: var(--title1); }
    .msg .time { font-size: 10px; color: var(--muted); align-self: flex-end; }
    .msg.mine { align-self: flex-end; background: var(--mine); }
    .msg.theirs { align-self: flex-start; background: var(--panel); }
    .msg.mine .sender { color: var(--mine-sender); }
    .msg .author { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
    .typing { color: var(--text1); font-size: 11px; padding: 0 14px 6px; }
    .input-row { display: flex; gap: 6px; padding: 8px 10px; border-top: 2px outset var(--light); background: var(--face); }
    .input-row input { margin-bottom: 0; flex: 1; }
    .send-btn { font-weight: bold; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .avatar.ring { box-shadow: 0 0 0 2px var(--ring); }
    .profile-card {
      background: var(--face); width: 360px; max-width: 94vw;
      border-top: 2px solid var(--light); border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
      box-shadow: 6px 6px 0 rgba(0,0,0,.35); position: relative;
    }
    .pf-banner {
      height: 110px; background: linear-gradient(135deg, var(--title1), var(--title2));
      background-size: cover; background-position: center;
    }
    .pf-main { padding: 14px; }
    .pf-top { display: flex; align-items: center; gap: 12px; margin-top: -42px; }
    .pf-avatar { width: 68px; height: 68px; border: 2px solid var(--light); background: var(--shadow); position: relative; }
    .pf-avatar .avatar { width: 100%; height: 100%; font-size: 26px; border-radius: 0; }
    .pf-head { margin-top: 8px; min-width: 0; flex: 1; }
    .pf-name { font-size: 16px; font-weight: bold; color: var(--title1); }
    .pf-user { font-size: 12px; color: var(--muted); }
    .pf-statusrow { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--text1); }
    .pf-bio { margin-top: 12px; font-size: 13px; color: var(--text1); white-space: pre-wrap; word-break: break-word; }
    .pf-bio-empty { color: var(--muted); font-style: italic; }
    .pf-actions { display: flex; gap: 8px; margin-top: 14px; }
    .pf-actions button { flex: 1; }
    .pf-row { margin: 10px 0; }
    .pf-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .pf-row textarea { width: 100%; min-height: 54px; resize: vertical; }
    .pf-edit { display: none; border-top: 1px solid var(--shadow); margin-top: 12px; padding-top: 6px; }
    .pf-colors { display: flex; flex-wrap: wrap; gap: 6px; }
    .pf-color {
      width: 22px; height: 22px; border: 1px solid var(--dark); cursor: pointer;
    }
    .pf-color.sel { box-shadow: 0 0 0 2px var(--light), 0 0 0 4px var(--title1); }
    .pf-filebtns { display: flex; gap: 6px; }
    .pf-filebtns button { flex: 1; font-size: 12px; }
    .pf-editbtns { display: flex; gap: 8px; margin-top: 10px; }
    .pf-editbtns button { flex: 1; }
    .pf-close {
      position: absolute; top: 6px; right: 8px; font-size: 16px; cursor: pointer;
      background: transparent; border: 0; color: var(--on-title); z-index: 2;
    }
    .modal {
      background: var(--face); padding: 0; width: 320px; max-width: 92vw;
      border-top: 2px solid var(--light); border-left: 2px solid var(--light);
      border-right: 2px solid var(--dark); border-bottom: 2px solid var(--dark);
      box-shadow: 4px 4px 0 rgba(0,0,0,.35);
    }
    .modal h3 {
      font-size: 13px; color:var(--on-title); font-weight: bold;
      background: linear-gradient(90deg, var(--title1), var(--title2));
      padding: 5px 8px; margin: 0;
    }
    .modal .modal-body { padding: 16px; }
    .modal .actions { display: flex; gap: 6px; justify-content: flex-end; padding: 0 16px 14px; }
    .status-badge { padding: 1px 8px; font-size: 11px; background: var(--face); color:var(--text1); border-top:1px solid var(--light); border-left:1px solid var(--light); border-right:1px solid var(--shadow); border-bottom:1px solid var(--shadow); }
    .status-badge.online { color: var(--ok); font-weight: bold; }
    .status-badge.offline { color: var(--muted); }
    .call-btn { font-weight: bold; }
    #call-panel { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; background: var(--face); border-bottom: 2px outset var(--light); }
    .call-info { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; flex: 1; color:var(--text1); }
    .pulse { width: 12px; height: 12px; background: #00a000; border: 1px solid var(--light); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%{background:#00a000;} 50%{background:#a0d000;} 100%{background:#00a000;} }
    .mute-btn { font-size: 12px; }
    #screen-box { background: #000; max-height: 40vh; overflow: auto; border-bottom: 1px solid var(--divider); }

    /* --- taskbar --- */
    #taskbar {
      height: 28px; background: var(--face);
      border-top: 2px outset var(--light);
      display: flex; align-items: center; gap: 8px; padding: 0 6px;
      position: fixed; left:0; right:0; bottom:0; z-index: 200;
    }
    #start-btn {
      display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: bold;
      padding: 3px 10px;
    }
    #start-btn img { width: 16px; height: 16px; }
    #taskbar .tb-clock { margin-left: auto; font-size: 11px; padding: 1px 8px; border-top: 1px solid var(--shadow); border-left: 1px solid var(--shadow); border-right: 1px solid var(--light); border-bottom: 1px solid var(--light); background: var(--face); }

    /* --- Material: Roboto, скругления, elevation-тени (M3) --- */
    html[data-theme="material"],
    html[data-theme="material"] body {
      font-family: 'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
    }
    html[data-theme="material"] button,
    html[data-theme="material"] .tab {
      border: none; border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.12);
      background: var(--face); font-weight: 500;
    }
    html[data-theme="material"] button:active {
      border: none; box-shadow: inset 0 1px 3px rgba(0,0,0,.35);
      padding: 4px 14px; border-radius: 20px;
    }
    html[data-theme="material"] input[type=text],
    html[data-theme="material"] input[type=password] {
      border: 1px solid var(--shadow); border-radius: 8px; box-shadow: none;
      background: var(--panel); padding: 7px 10px;
    }
    html[data-theme="material"] input:focus {
      border-color: var(--title1); box-shadow: 0 0 0 2px var(--title2); background: var(--panel);
    }
    html[data-theme="material"] .tab { border-radius: 20px 20px 0 0; box-shadow: none; }
    html[data-theme="material"] .tab.active {
      border: none; background: var(--panel);
      box-shadow: inset 0 -3px 0 var(--title1);
    }
    html[data-theme="material"] .auth-card,
    html[data-theme="material"] .modal {
      border: none; border-radius: 16px;
      box-shadow: 0 8px 12px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.20);
    }
    html[data-theme="material"] .auth-card h1,
    html[data-theme="material"] .modal h3 { border: none; border-radius: 16px 16px 0 0; font-weight: 500; letter-spacing: .5px; }
    html[data-theme="material"] .msg { border: none; border-radius: 16px; }
    html[data-theme="material"] .avatar,
    html[data-theme="material"] .avatar-sm,
    html[data-theme="material"] .msg .msg-avatar { border: none; border-radius: 50%; }
    html[data-theme="material"] .online-dot,
    html[data-theme="material"] .pulse { border: none; border-radius: 50%; }
    html[data-theme="material"] ::-webkit-scrollbar-thumb { border: none; border-radius: 10px; background: var(--shadow); }
    html[data-theme="material"] .sidebar { border-right: 1px solid var(--divider); }
    html[data-theme="material"] .th-opt { border: 1px solid var(--shadow); border-radius: 16px; }

    /* --- Material Web Components: интеграция --- */
    /* Палитра M3 токенами (--md-sys-* наследуются сквозь shadow DOM,
       поэтому светлая/тёмная тема компонентов переключается у нас) */
    html[data-theme="material"] {
      color-scheme: light;
      --md-sys-color-primary: #6750a4;          --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff; --md-sys-color-on-primary-container: #21005d;
      --md-sys-color-secondary: #625b71;         --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #e8def8; --md-sys-color-on-secondary-container: #1d192b;
      --md-sys-color-surface: #fffbfe;           --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #79747e;           --md-sys-color-outline-variant: #cac4d0;
      --md-sys-color-error: #b3261e;             --md-sys-color-on-error: #ffffff;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f7f2fa;
      --md-sys-color-surface-container: #fffbfe;
      --md-sys-color-surface-container-high: #ece6f0;
      --md-sys-color-surface-container-highest: #e6e0e9;
      --md-sys-typescale-body-large-font: 'Roboto', 'Segoe UI', sans-serif;
      --md-sys-typescale-body-medium-font: 'Roboto', 'Segoe UI', sans-serif;
      --md-sys-typescale-label-large-font: 'Roboto', 'Segoe UI', sans-serif;
      --md-sys-typescale-title-medium-font: 'Roboto', 'Segoe UI', sans-serif;
    }
    html[data-theme="material"][data-mode="dark"] {
      color-scheme: dark;
      --md-sys-color-primary: #d0bcff;          --md-sys-color-on-primary: #371e73;
      --md-sys-color-primary-container: #4f378b; --md-sys-color-on-primary-container: #eaddff;
      --md-sys-color-secondary: #ccc2dc;         --md-sys-color-on-secondary: #322e3e;
      --md-sys-color-secondary-container: #4a4458; --md-sys-color-on-secondary-container: #e8def8;
      --md-sys-color-surface: #141218;           --md-sys-color-on-surface: #e6e0e9;

  <!-- PROFILE -->
  <div class="modal-overlay" id="profile-overlay" style="display:none">
    <div class="profile-card">
      <div class="pf-banner" id="pf-banner"></div>
      <button class="pf-close" id="pf-close" title="×">×</button>
      <div class="pf-main">
        <div class="pf-top">
          <div class="pf-avatar" id="pf-avatar"></div>
          <div class="pf-head">
            <div class="pf-name" id="pf-name"></div>
            <div class="pf-user" id="pf-user"></div>
            <div class="pf-statusrow"><span class="status-badge offline" id="pf-status"></span><span id="pf-status-text"></span></div>
          </div>
        </div>
        <div class="pf-bio" id="pf-bio"></div>
        <div class="pf-edit" id="pf-edit">
          <input type="file" id="pf-avatar-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" />
          <input type="file" id="pf-banner-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" />
          <div class="pf-filebtns">
            <button class="btn-secondary" id="pf-avatar-btn" data-t="change_avatar">Сменить аватар</button>
            <button class="btn-secondary" id="pf-banner-btn" data-t="change_banner">Сменить баннер</button>
          </div>

            <label data-t="about">О себе</label>
            <textarea id="pf-bio-input" data-t-placeholder="bio_ph" placeholder="..."></textarea>
          </div>
          <div class="pf-row">
            <label data-t="status_label">Статус</label>
            <input type="text" id="pf-status-input" maxlength="100" data-t-placeholder="status_ph" placeholder="..." />
          </div>
          <div class="pf-row">
            <label data-t="color_label">Цвет профиля</label>
            <div class="pf-colors" id="pf-colors"></div>

          <div class="pf-editbtns">
            <button class="btn-ok" id="pf-save" data-t="save">Сохранить</button>
            <button class="btn-secondary" id="pf-cancel" data-t="cancel">Отмена</button>
          </div>
        </div>
        <div class="pf-actions" id="pf-actions">
          <button class="btn-secondary" id="pf-edit-btn" data-t="edit_btn">Изменить профиль</button>
          <button class="btn-ok" id="pf-msg-btn" data-t="send_msg">Написать</button>

      </div>

  <!-- TASKBAR -->
  <div id="taskbar">
    <button id="start-btn"><img src="/icon.png" alt="" />nekochat</button>
    <span class="tb-clock" id="tb-clock">--:--</span>
  </div>

  <script>
    // ---------- Material Web Components: ранний апгрейд DOM ----------
    // Меняет нативные кнопки/поля на <md-*> ДО навешивания обработчиков
    // (в win98 — не делает ничего). Повторно вызывается для динамического
    // контента (панель звонка) сразу после innerHTML и до addEventListener.
    function materialize(root) {
      if (document.documentElement.dataset.theme !== 'material') return;
      // data-no-md — элементы макета (нижняя панель, поле ввода, кнопка звонка):
      // их не трогаем, иначе md-компоненты принесут свои отступы и обводки.
      const skip = el => !!(el.closest && el.closest('[data-no-md]'));
      root.querySelectorAll('button').forEach(b => {
        if (b.tagName.startsWith('MD-')) return;
        if (skip(b)) return;
        const filled = b.id === 'auth-button' || b.id === 'add-btn' || b.id === 'send-btn' ||
                       b.id === 'call-btn' || b.id === 'call-answer' ||
                       b.classList.contains('btn-ok') || b.classList.contains('send-btn');
        const outlined = b.classList.contains('btn-secondary') || b.classList.contains('mute-btn') ||
                         b.id === 'call-end' || b.id === 'call-decline' ||
                         b.id === 'theme-btn' || b.id === 'modal-cancel';
        const md = document.createElement(
          filled ? 'md-filled-button' : outlined ? 'md-filled-tonal-button' : 'md-text-button');
        [...b.attributes].forEach(a => md.setAttribute(a.name, a.value));
        md.innerHTML = b.innerHTML;
        b.replaceWith(md);
      });
      root.querySelectorAll('input[type=text], input[type=password], textarea').forEach(inp => {
        if (inp.tagName.startsWith('MD-')) return;
        if (skip(inp)) return;
        const md = document.createElement('md-outlined-text-field');
        [...inp.attributes].forEach(a => {
          if (a.name === 'type' || a.name === 'value' || a.name === 'size') return;
          md.setAttribute(a.name, a.value);
        });
        if (inp.type === 'password') md.setAttribute('type', 'password');
        if (inp.tagName === 'TEXTAREA') md.setAttribute('type', 'textarea');
        const lbl = inp.id ? document.querySelector('label[for="' + inp.id + '"]') : null;
        if (lbl) {  // текст подписи переехал в плавающий label самого поля
          md.setAttribute('label', lbl.textContent.trim());
          if (lbl.dataset.t) md.dataset.t = lbl.dataset.t;
          lbl.dataset.md = '1';  // скрывается css: label[data-md="1"]
        }
        md.value = inp.value || '';
        inp.replaceWith(md);
      });
    }
    materialize(document);

    // safe storage (some browsers block localStorage => whole script would die)
    const store = {
      get() { try { return localStorage.getItem('nk_token'); } catch (e) { return null; } },
      set(t) { try { localStorage.setItem('nk_token', t); } catch (e) {} },
      clear() { try { localStorage.removeItem('nk_token'); } catch (e) {} },
    };
    // ---------- theme ----------
    const Theme = {
      KEY: 'nk_theme',
      get() {
        var v;
        try { v = localStorage.getItem(this.KEY) || 'material-dark'; } catch (e) { return 'material-dark'; }
        if (/^standard-/.test(v)) { v = v.replace('standard-', 'material-'); this.set(v); }
        return v;
      },
      set(v) { try { localStorage.setItem(this.KEY, v); } catch (e) {} },
      apply(v) {
        if (/^standard-/.test(v)) v = v.replace('standard-', 'material-');
        if (!/^(win98|material)-(light|dark)$/.test(v)) v = 'material-dark';
        const p = v.split('-');
        document.documentElement.dataset.theme = p[0];
        document.documentElement.dataset.mode = p[1];
        return v;
      },
    };
    function syncThemeForm() {
      const p = Theme.get().split('-');
      const q = (n, val) => document.querySelector(`input[name="${n}"][value="${val}"]`);
      const el = q('th-style', p[0]) || q('th-style', 'material');
      const em = q('th-mode', p[1]) || q('th-mode', 'dark');
      el.checked = true;
      em.checked = true;
    }
    let themeAtOpen = null;
    function openTheme() {
      syncThemeForm();
      themeAtOpen = Theme.get();
      $('#theme-overlay').style.display = 'flex';
    }
    const $ = s => document.querySelector(s);
    applyTranslations();
    let token = store.get();

    let me = null;
    let currentView = 'rooms';
    let current = null; // { type: 'room', room } | { type: 'dm', user, conv }
    let rooms = [];
    let users = [];
    let conversations = [];
    let onlineUsers = new Set();
    let ws = null;

    // ---------- helpers ----------
    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
          ...(opts.headers || {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { const e = new Error(data.detail || res.statusText); e.status = res.status; throw e; }
      return data;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ---------- auth ----------
    let isRegister = false;
    function updateAuthText() {
      $('#auth-button').textContent = t(isRegister ? 'btn_register' : 'btn_login');
      $('#auth-switch-link').innerHTML = isRegister ? '<a>' + t('link_login') + '</a>' : '<a>' + t('link_register') + '</a>';
    }
    window._langFns.push(updateAuthText);
    $('#auth-switch-link').addEventListener('click', () => {
      isRegister = !isRegister;
      $('#auth-display').style.display = isRegister ? 'block' : 'none';
      $('#lbl-display').style.display = isRegister ? 'block' : 'none';
      updateAuthText();
      $('#auth-err').textContent = '';
    });

    async function doAuth() {
      const username = $('#auth-username').value.trim();
      const password = $('#auth-password').value;
      const display = $('#auth-display').value.trim() || username;
      $('#auth-err').textContent = '';
      try {
        let data;
        if (isRegister) {
          data = await api('/auth/register', { method: 'POST', body: JSON.stringify({ username, password, display_name: display }) });
        } else {
          data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        }
        store.set(data.access_token);
        token = data.access_token;
        location.reload();
      } catch (e) {
        $('#auth-err').textContent = e.message;
      }
    }
    updateAuthText();
    $('#auth-button').addEventListener('click', doAuth);
    $('#auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

    // ---------- avatars ----------
    const userById = new Map();
    function rememberUsers(list) {
      (list || []).forEach(u => userById.set(u.id, u));
    }
    function avatarContent(u) {
      if (!u) return '?';
      if (u.avatar) return `<img src="/avatars/${encodeURIComponent(u.avatar)}" alt="" />`;
      return esc((u.display_name || u.username || '?')[0].toUpperCase());
    }
    function avatarHtml(u, cls) {
      const ring = u && u.profile_color ? 'ring' : '';
      const st = u && u.profile_color ? ` style="--ring:${u.profile_color}"` : '';
      return `<span class="avatar ${cls} ${ring}"${st}>${avatarContent(u)}</span>`;
    }
    function renderMe() {
      const av = $('#appbar-avatar');
      if (av) {
        av.innerHTML = avatarHtml(me, '') +
          '<span class="appbar-avatar-dot"></span>';
        av.title = me.display_name || me.username;
        av.onclick = () => openProfile(me);
      }
      $('#me-name').textContent = me.display_name;
      $('#me-user').textContent = '@' + me.username;
      $('#me-avatar').innerHTML = avatarContent(me);
      $('#me-avatar').classList.toggle('ring', !!me.profile_color);
      if (me.profile_color) $('#me-avatar').style.setProperty('--ring', me.profile_color);
      else $('#me-avatar').style.removeProperty('--ring');
      $('#me-status').textContent = me.status || '';
      $('#me-status').style.display = me.status ? '' : 'none';
      if ($('#appbar-me')) $('#appbar-me').textContent = me.display_name || me.username;
    }
    async function uploadAvatar(file) {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch('/users/me/avatar', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { const e = new Error(data.detail || res.statusText); e.status = res.status; throw e; }
        me.avatar = data.avatar;
        renderMe();
        rememberUsers([me]);
        renderList();
        if (profileOpen() && me) renderProfile(me);
      } catch (e) {
        alert(e.message);
      }
    }
    async function uploadBanner(file) {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch('/users/me/banner', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { const e = new Error(data.detail || res.statusText); e.status = res.status; throw e; }
        me.banner = data.banner;
        renderMe();
        rememberUsers([me]);
        renderList();
        if (profileOpen()) renderProfile(me);
      } catch (e) {
        alert(e.message);
      }
    }
    $('#me-box').addEventListener('click', () => openProfile(me));
    $('#me-avatar').addEventListener('click', () => openProfile(me));
    $('#avatar-input').addEventListener('change', e => { uploadAvatar(e.target.files[0]); e.target.value = ''; });

    // ---------- profile ----------
    const PROFILE_COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#1abc9c', '#3498db', '#9b59b6', '#e84393', '#8d6e63', '#607d8b', '#7f8c8d', '#ffffff'];
    let profileTarget = null;
    let profileColorSel = null;
    function profileOpen() { return $('#profile-overlay').style.display === 'flex'; }
    function renderProfile(user) {
      profileTarget = user;
      const banner = $('#pf-banner');
      if (user && user.banner) {
        banner.style.backgroundImage = `url('/avatars/${encodeURIComponent(user.banner)}')`;
        banner.style.backgroundColor = '';
      } else {
        banner.style.backgroundImage = '';
        banner.style.backgroundColor = (user && user.profile_color) || '';
      }
      $('#pf-avatar').innerHTML = avatarHtml(user, '');
      $('#pf-name').textContent = user ? (user.display_name || user.username || '?') : '?';
      $('#pf-user').textContent = user ? '@' + user.username : '';
      const online = user ? onlineUsers.has(user.id) : false;
      const st = $('#pf-status');
      st.className = 'status-badge ' + (online ? 'online' : 'offline');
      st.textContent = online ? t('online') : t('offline');
      $('#pf-status-text').textContent = (user && user.status) || '';
      const bio = $('#pf-bio');
      if (user && user.bio) {
        bio.textContent = user.bio;
        bio.classList.remove('pf-bio-empty');
      } else {
        bio.textContent = t('no_bio');
        bio.classList.add('pf-bio-empty');
      }
      const isMe = user && me && user.id === me.id;
      $('#pf-edit').style.display = 'none';
      $('#pf-actions').style.display = 'flex';
      $('#pf-edit-btn').style.display = isMe ? '' : 'none';
      $('#pf-msg-btn').style.display = !isMe ? '' : 'none';
    }
    function openProfile(user) {
      if (!user) return;
      renderProfile(user);
      $('#profile-overlay').style.display = 'flex';
    }
    function closeProfile() { $('#profile-overlay').style.display = 'none'; }
    function startEdit() {
      $('#pf-bio-input').value = me.bio || '';
      $('#pf-status-input').value = me.status || '';
      profileColorSel = me.profile_color || null;
      paintColors();
      $('#pf-actions').style.display = 'none';
      $('#pf-edit').style.display = 'block';
    }
    function cancelEdit() {
      $('#pf-edit').style.display = 'none';
      $('#pf-actions').style.display = 'flex';
    }
    function paintColors() {
      const box = $('#pf-colors');
      box.innerHTML = '';
      PROFILE_COLORS.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'pf-color' + (profileColorSel === c ? ' sel' : '');
        sw.style.background = c;
        sw.addEventListener('click', () => {
          profileColorSel = profileColorSel === c ? null : c;
          paintColors();
        });
        box.appendChild(sw);
      });
    }
    async function saveProfile() {
      try {
        const data = await api('/users/me/profile', {
          method: 'PUT',
          body: JSON.stringify({
            bio: $('#pf-bio-input').value,
            status: $('#pf-status-input').value,
            profile_color: profileColorSel,
          }),
        });
        me = data;
        rememberUsers([me]);
        renderMe();
        renderList();
        renderProfile(me);
        cancelEdit();
      } catch (e) {
        alert(e.message);
      }
    }
    $('#pf-close').addEventListener('click', closeProfile);
    $('#profile-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeProfile(); });
    $('#pf-edit-btn').addEventListener('click', startEdit);
    $('#pf-edit').addEventListener('click', e => e.stopPropagation());
    $('#pf-msg-btn').addEventListener('click', () => {
      const u = profileTarget;
      closeProfile();
      if (!u) return;
      const peer = users.find(x => x.id === u.id);
      if (peer) openDM(peer); else if (u.id !== me.id) openDM(u);
    });
    $('#pf-avatar-btn').addEventListener('click', () => $('#pf-avatar-input').click());
    $('#pf-banner-btn').addEventListener('click', () => $('#pf-banner-input').click());
    $('#pf-avatar-input').addEventListener('change', e => { uploadAvatar(e.target.files[0]); e.target.value = ''; });
    $('#pf-banner-input').addEventListener('change', e => { uploadBanner(e.target.files[0]); e.target.value = ''; });
    $('#pf-save').addEventListener('click', saveProfile);
    $('#pf-cancel').addEventListener('click', cancelEdit);

    // ---------- boot ----------
    if (token) {
      (async function boot() {
        try {
          me = await api('/api/me');
          $('#app').style.display = 'block';
          $('#auth').style.display = 'none';
          renderMe();
          rememberUsers([me]);
          await refreshData();
          connectWS();
        } catch (e) {
          if (e.status === 401) {
            // token invalid/expired -> real logout
            store.clear();
            location.reload();
          } else {
            // transient failure -> retry shortly, do NOT kick user out
            setTimeout(boot, 2000);
          }
        }
      })();
    }

    async function refreshData() {
      const [r, u, c] = await Promise.all([
        api('/rooms'),
        api('/users'),
        api('/users/conversations/me'),
      ]);
      rooms = r; users = u; conversations = c;
      rememberUsers(users);
      rememberUsers(conversations.map(conv => conv.user));
      rooms.forEach(room => rememberUsers(room.members));
      renderList();
      renderAppbar();
    }

    // ---------- websocket ----------
    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = () => {
        // туннель периодически рвёт WS: возвращаемся в голосовой канал — анонс присутствия
        if ((callState === 'active' || callState === 'connecting') && roomId != null && callId) {
          wsSend({ type: 'call', room_id: roomId, call_id: callId });
        }
      };
      ws.onclose = () => setTimeout(connectWS, 1500);
      ws.onmessage = ev => {
        const data = JSON.parse(ev.data);
        handleWS(data);
      };
    }

    function handleWS(data) {
      if (data.type === 'status') {
        if (data.online) onlineUsers.add(data.user_id); else onlineUsers.delete(data.user_id);
        renderList();
        if (current && current.type === 'dm' && current.user.id === data.user_id) {
          $('#chat-sub').textContent = data.online ? t('online') : t('offline');
        }
        renderAppbar();
        return;
      }
      if (data.type === 'room_message') {
        if (current && current.type === 'room' && current.room.id === data.room_id) {
          appendMessage({
            content: data.message.content,
            sender_id: data.message.user_id,
            sender_name: (userById.get(data.message.user_id) || {}).display_name,
            time: data.message.created_at,
            isMine: data.message.user_id === me.id,
          });
        } else {
          maybeFlashRoom(data.room_id);
        }
      } else if (data.type === 'direct_message') {
        if (current && current.type === 'dm' && (data.from_id === current.user.id || data.from_id === me.id)) {
          const dmSenderId = (data.message && data.message.sender_id != null) ? data.message.sender_id : data.from_id;
          appendMessage({
            content: data.message.content,
            sender_id: dmSenderId,
            sender_name: dmSenderId === me.id ? me.display_name : (userById.get(dmSenderId) || {}).display_name,
            time: data.message.created_at,
            isMine: dmSenderId === me.id,
          });
        } else {
          refreshData();
        }
      }
      handleCallSignal(data);
    }

    // simple flash: re-render active tab on incoming while not viewing
    function maybeFlashRoom(roomId) {
      if (current && current.type === 'room' && current.room.id === roomId) return;
      refreshData();
    }

    // ---------- list rendering ----------
    function renderList() {
      const list = $('#list');
      const q = $('#search-input').value.trim().toLowerCase();
      list.innerHTML = '';
      if (currentView === 'rooms') {
        const visible = rooms.filter(r => r.name.toLowerCase().includes(q));
        if (!visible.length) {
          list.innerHTML = '<div class="empty">' + t('no_rooms') + '</div>';
          addBtnVisibility();
          return;
        }
        visible.forEach(r => {
          const el = document.createElement('div');
          el.className = 'list-item' + (current && current.type === 'room' && current.room.id === r.id ? ' active' : '');
          el.dataset.target = `room-${r.id}`;
          el.innerHTML = `
            <div class="avatar" style="background:linear-gradient(135deg,#4a7cff,#7c5cff)">#</div>
            <div class="info">
              <div class="title">${esc(r.name)}</div>
              <div class="meta">${r.member_count} ' + t('participants', r.member_count) + '</div>
            </div>`;
          el.onclick = () => openRoom(r);
          list.appendChild(el);
        });
      } else {
        const visible = users.filter(u => u.username.toLowerCase().includes(q));
        if (!visible.length) {
          list.innerHTML = '<div class="empty">' + t('no_users') + '</div>';
          addBtnVisibility();
          return;
        }
        visible.forEach(u => {
          const el = document.createElement('div');
          const conv = conversations.find(c => c.user.id === u.id);
          el.className = 'list-item' + (current && current.type === 'dm' && current.user.id === u.id ? ' active' : '');
          el.dataset.target = `dm-${u.id}`;
          el.innerHTML = `
            <span class="online-dot ${onlineUsers.has(u.id) ? 'online' : ''}"></span>
            ${avatarHtml(u, '')}
            <div class="info">

    function pushMicFrame(samples) {

    async function mountMicCapture(ctx, src) {

          const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(url);
          URL.revokeObjectURL(url);
          const node = new AudioWorkletNode(ctx, 'mic-capture');
          node.port.onmessage = e => { if (callState === 'active' && !muted) pushMicFrame(e.data); };
          src.connect(node);
          node.connect(ctx.destination);
          micWorklet = node;
          return;
        } catch (e) { /* фолбэк: ScriptProcessor */ }
      }
      const sp = ctx.createScriptProcessor(4096, 1, 1);
      sp.onaudioprocess = e => {
        if (callState !== 'active' || muted || !enc) return;
        const input = e.inputBuffer.getChannelData(0);
        const m = new Float32Array(encBuf.length + input.length);
        m.set(encBuf, 0); m.set(input, encBuf.length);
        let o = 0;
        while (m.length - o >= CALL_SAMPLES) { pushMicFrame(m.subarray(o, o + CALL_SAMPLES)); o += CALL_SAMPLES; }
        encBuf = m.slice(o);
      };
      src.connect(sp);
      const g = ctx.createGain(); g.gain.value = 0;
      sp.connect(g); g.connect(ctx.destination);

      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          video: false,
        });
      } catch (e) {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      }
    }
    async function startMicAndEncoder() {
      if (!codecsOk()) throw new Error('no-codecs');
      localStream = await grabMic();
      const ctx = new AudioContext({ sampleRate: CALL_RATE });
      await ctx.resume();
      micCtx = ctx;
      try {
        playCtx = new AudioContext({ sampleRate: CALL_RATE });
        await playCtx.resume();
      } catch (e) { playCtx = ctx; }
      const src = ctx.createMediaStreamSource(localStream);
      await mountMicCapture(ctx, src);
      enc = new AudioEncoder({
        output: chunk => {
          try {
            if (callState !== 'active' || muted || !callId) return;
            if (roomId == null && peerId == null) return;
            const bytes = new Uint8Array(chunk.byteLength);
            chunk.copyTo(bytes);
            const sig = { type: 'call_audio', call_id: callId, seq: callSeq++, audio: b64enc(bytes) };
            if (roomId != null) sig.room_id = roomId; else sig.to_id = peerId;
            callSig(sig);
          } catch (e) {}
        },
        error: () => {},
      });
      enc.configure({ codec: 'opus', sampleRate: CALL_RATE, numberOfChannels: 1, bitrate: 24000 });
    }

    // ---------- приём: Opus → джиттер-буфер → AudioContext (декодер на каждого) ----------
    function ensureRemote(id) {
      let r = remotes[id];
      if (!r) {
        r = { dec: null, q: [], next: null };
        remotes[id] = r;
      }
      if (!r.dec && codecsOk()) {
        r.dec = new AudioDecoder({
          output: ad => {
            try {
              if (!playCtx || callState !== 'active') { ad.close(); return; }
              const n = ad.numberOfFrames, chs = Math.min(1, ad.numberOfChannels);
              const buf = playCtx.createBuffer(chs, n, ad.sampleRate);
              const tmp = new Float32Array(n);
              ad.copyTo(tmp, { planeIndex: 0 });
              buf.copyToChannel(tmp, 0, 0);
              ad.close();
              r.q.push(buf);
              scheduleRemote(r);
            } catch (e) { try { ad.close(); } catch (e2) {} }
          },
          error: () => {},
        });
        r.dec.configure({ codec: 'opus', sampleRate: CALL_RATE, numberOfChannels: 1 });
        r.q = []; r.next = null;
      }
      return r;
    }
    function removeRemote(id) {
      const r = remotes[id];
      if (r) { try { if (r.dec) r.dec.close(); } catch (e) {} delete remotes[id]; }
    }
    function scheduleRemote(r) {
      if (!playCtx) return;
      if (r.q.length > 100) r.q.splice(0, r.q.length - 100);
      const now = playCtx.currentTime;
      if (r.next == null || r.next < now - 0.05) {
        if (r.q.length < START_FRAMES) return;
        r.next = now + PREBUF_MS / 1000;
      }
      while (r.q.length) {
        const b = r.q.shift();
        const s = playCtx.createBufferSource();
        s.buffer = b;
        s.connect(playCtx.destination);
        s.start(r.next);
        r.next += b.duration;
      }
    }
    function teardownMic() {
      try { if (micWorklet) micWorklet.disconnect(); } catch (e) {}
      micWorklet = null;
      try { if (micScript) { micScript.disconnect(); micScript.onaudioprocess = null; } } catch (e) {}
      micScript = null;
      try { if (enc) enc.close(); } catch (e) {}
      enc = null;
      for (const id in remotes) {
        try { if (remotes[id].dec) remotes[id].dec.close(); } catch (e) {}
      }
      remotes = {};
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      try { if (micCtx) micCtx.close(); } catch (e) {}
      const pc = playCtx; playCtx = null;
      try { if (pc && pc !== micCtx) pc.close(); } catch (e) {}
      micCtx = null;
      encBuf = new Float32Array(0); encTs = 0;
    }
    function clearRing() { if (ringTimer != null) { clearTimeout(ringTimer); ringTimer = null; } }
    function clearEnd() { if (endTimer != null) { clearTimeout(endTimer); endTimer = null; } }

    // ---------- исходящий ----------
    async function startCall() {
      if (!(callState === 'idle' || callState === 'ended') || !current) return;
      if (current.type !== 'dm' && current.type !== 'room') return;
      const g = ++callGen;
      clearEnd(); clearRing();
      teardownMic();
      stopScreenShareLocal();
      stopScreenReceive();
      if (current.type === 'dm') {
        peerId = current.user.id;
        roomId = null;
      } else {
        roomId = current.room.id;
        peerId = null;
      }
      inviterId = null;
      participants = [];
      callId = 'c' + Date.now().toString(36) + (callSeq++).toString(36) + Math.random().toString(36).slice(2, 8);
      muted = false;
      if (roomId != null) {
        // голосовой канал комнаты: не звоним, анонсируем вход — остальные входят сами
        callState = 'connecting';
        showChannelActive(t('voice_channel') + ': ' + esc(current.room.name));
        callSig({ type: 'call', room_id: roomId, call_id: callId });
      } else {
        callState = 'outgoing';
        showCallActive(t('calling') + esc(current.user.display_name) + '...');
        ringTimer = setTimeout(() => { if (callState === 'outgoing') hangup(t('call_no_answer')); }, RING_MS);
        callSig({ type: 'call', to_id: peerId, call_id: callId });
        ensureRemote(peerId);
      }
      try {
        await startMicAndEncoder();
        if (g !== callGen) return;
        if (roomId != null) {
          callState = 'active';
          showChannelActive(t('voice_channel') + ': ' + esc(current.room.name));
        } else if (callState === 'outgoing') {
          callState = 'connecting';
        }
      } catch (e) {
        if (g !== callGen) return;
        const reason = e && e.message === 'no-codecs'
          ? 'WebView не поддерживает Opus'
          : t('no_mic') + String((e && e.message) || e);
        if (roomId != null && callId) callSig({ type: 'call_hangup', room_id: roomId, call_id: callId, reason: 'mic' });
        else if (peerId != null && callId) callSig({ type: 'call_hangup', to_id: peerId, call_id: callId, reason: 'mic' });
        endCall(false, reason);
      }
    }

    // ---------- входящий ----------
    async function answerCall() {
      if (callState !== 'incoming') return;
      const g = ++callGen;
      clearRing();
      callState = 'connecting';
      if (roomId != null) {
        // входим в голосовой канал
        if (callId) callSig({ type: 'call_answer', room_id: roomId, call_id: callId });
        const r = rooms.find(x => x.id === roomId);
        showChannelActive(t('voice_channel') + ': ' + (r ? esc(r.name) : ''));
      } else if (peerId != null) {
        showCallActive(t('call_active_label') + esc(userName(peerId)));
        ensureRemote(peerId);
        if (callId) callSig({ type: 'call_answer', to_id: peerId, call_id: callId });
      } else {
        endCall(false, t('call_ended'));
        return;
      }
      try {
        await startMicAndEncoder();
        if (g !== callGen) return;
        callState = 'active';
        if (roomId != null) {
          const r = rooms.find(x => x.id === roomId);
          showChannelActive(t('voice_channel') + ': ' + (r ? esc(r.name) : ''));
        } else {
          showCallActive(t('call_active_label') + esc(userName(peerId)), true);
        }
      } catch (e) {
        if (g !== callGen) return;
        const reason = e && e.message === 'no-codecs'
          ? 'WebView не поддерживает Opus'
          : t('no_mic') + String((e && e.message) || e);
        if (roomId != null && callId) callSig({ type: 'call_hangup', room_id: roomId, call_id: callId, reason: 'mic' });
        else if (peerId != null && callId) callSig({ type: 'call_hangup', to_id: peerId, call_id: callId, reason: 'mic' });
        endCall(false, reason);
      }
    }

    function hangup(reason) {
      if (callState === 'idle' || callState === 'ended') return;
      if (roomId != null && callId) {
        callSig({ type: 'call_hangup', room_id: roomId, call_id: callId, reason: reason || 'leave' });
      } else if (peerId != null && callId) {
        callSig({ type: 'call_hangup', to_id: peerId, call_id: callId, reason: reason || '' });
      }
      endCall(false, reason || t('call_ended'));
    }

    function endCall(sent, reason) {
      const g = ++callGen;
      clearRing(); clearEnd();
      teardownMic();
      stopScreenShareLocal();
      stopScreenReceive();
      const msg = reason || t('call_ended');
      callState = 'ended';
      showCallEnded(msg);
      endTimer = setTimeout(() => {
        if (g !== callGen) return;
        callState = 'idle'; peerId = null; roomId = null; inviterId = null; callId = null; muted = false;
        participants = [];
        scrFrom = null;
        hideCall();
        hideScreenBox();
      }, END_MS);
    }

    // ---------- голосовой канал: участники ----------
    function addParticipant(id) {
      ensureRemote(id);
      if (participants.some(p => p.id === id)) return;
      participants = participants.concat([{ id, screen: false }]);
      renderChannelList();
    }
    function removeParticipant(id) {
      removeRemote(id);
      participants = participants.filter(p => p.id !== id);
      renderChannelList();
    }
    function setParticipantScreen(id, on) {
      participants = participants.map(p => p.id === id ? { id, screen: on } : p);
      renderChannelList();
    }
    function renderChannelList() {
      const el = $('#channel-members');
      if (!el) return;
      el.innerHTML = participants.map(p =>
        '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;min-width:200px">' +
        '<span class="status-badge online"></span><span>' + esc(userName(p.id)) + '</span>' +
        (p.screen ? '<span class="ico-slot">' + ico('monitor', 14) + '</span>' : '') +
        '</div>'
      ).join('');
    }
    function showChannelInvite(label) {
      callUi(
        ico('phone', 15) + ' ' + esc(t('call_incoming')) + ' <b>' + esc(label) + '</b>' +
        ico('arrow', 14) + ' ' + esc(t('voice_channel')) +
        '<div style="display:flex;gap:8px;margin-top:6px">' +
        callBtn('call-answer', esc(t('join_channel'))) +
        callBtn('call-decline', esc(t('later'))) +
        '</div>'
      );
      $('#call-answer').addEventListener('click', answerCall);
      $('#call-decline').addEventListener('click', () => endCall(false, ''));
    }
    function showChannelActive(label) {
      callUi(
        ico('phone', 15) + ' <b>' + esc(t('voice_channel')) + '</b>' +
        '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px">' + label + '</div>' +
        '<div id="channel-members" style="min-width:190px"></div>' +
        '<div style="display:flex;gap:8px">' +
        callBtn('mute-btn', muted ? t('muted') : t('unmuted'), 'mute-btn', muted ? 'micOff' : 'mic') +
        callBtn('screen-btn', esc(t('screen_share')), 'mute-btn', 'monitor') +
        callBtn('call-end', esc(t('btn_end_call'))) +
        '</div>'
      );
      $('#mute-btn').addEventListener('click', toggleMute);
      $('#screen-btn').addEventListener('click', startOrStopScreen);
      $('#call-end').addEventListener('click', () => hangup());
      renderChannelList();
    }

    // ---------- демонстрация экрана (видео по WS, без WebRTC) ----------
    let scrStream = null, scrTrack = null, scrEnc = null, scrDec = null;
    let scrSeq = 0, scrCanvas = null, scrVideo = null, scrCodec = null;
    let scrW = 0, scrH = 0, scrForceKey = false, scrProcessing = false;
    let scrFrom = null;  // в канале: чей экран показываем

    function screenCanvas() {
      if (!scrCanvas) scrCanvas = $('#screen-canvas');
      return scrCanvas;
    }
    function showScreenBox(active) {
      const b = $('#screen-box');
      if (!b) return;
      b.style.display = active ? 'block' : 'none';
      if (active) {
        const c = screenCanvas();
        if (c) { const g = c.getContext('2d'); if (g) g.clearRect(0, 0, c.width, c.height); }
      }
    }
    function hideScreenBox() { showScreenBox(false); }

    function startOrStopScreen() {
      if (scrEnc) stopScreenShareLocal();
      else startScreenShareLocal();
    }

    async function pickVideoCodec(w, h) {
      for (const codec of ['vp09.00.10.08', 'vp8', 'av01.0.04M.08']) {
        try {
          const r = await VideoEncoder.isConfigSupported({ codec, width: w, height: h, bitrate: 1200000, framerate: 20 });
          if (r && r.supported) return codec;
        } catch (e) {}
      }
      return null;
    }
    function setupScreenEncoder(codec, w, h) {
      if (scrEnc) { try { scrEnc.close(); } catch (e) {} }
      scrEnc = new VideoEncoder({
        output: chunk => {
          if (callState !== 'active' || !callId) return;
          if (roomId == null && peerId == null) return;
          try {
            const bytes = new Uint8Array(chunk.byteLength);
            chunk.copyTo(bytes);
            const sig = { type: 'screen_frame', call_id: callId, seq: scrSeq++, key: chunk.type === 'key', data: b64enc(bytes) };
            if (roomId != null) sig.room_id = roomId; else sig.to_id = peerId;
            callSig(sig);
            if (scrSeq % 150 === 0) scrForceKey = true;
          } catch (e) {}
        },
        error: () => {},
      });
      scrEnc.configure({ codec, width: w, height: h, bitrate: 1200000, framerate: 20 });
    }
    function encodeScreenFrame(frame) {
      if (!scrEnc || scrEnc.state !== 'configured' || !scrProcessing && !scrVideo) {
        try { frame.close(); } catch (e) {}
        return;
      }
      try {
        scrEnc.encode(frame, { keyFrame: scrForceKey });
      } catch (e) {}
      scrForceKey = false;
      try { frame.close(); } catch (e) {}
    }
    async function startScreenShareLocal() {
      if (callState !== 'active' || scrEnc) return;
      if (!(window.VideoEncoder && window.VideoDecoder && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia)) {
        alert('Экран не поддерживается этим браузером');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, frameRate: { ideal: 20, max: 30 } },
          audio: false,
        });
        if (callState !== 'active' || (roomId == null && peerId == null)) { stream.getTracks().forEach(t => t.stop()); return; }
        scrStream = stream;
        scrTrack = stream.getVideoTracks()[0];
        scrTrack.addEventListener('ended', () => stopScreenShareLocal());
        const s = scrTrack.getSettings();
        let w = Math.min(Math.round(s.width || 1280), 1280) & ~1 | 1;
        let h = Math.min(Math.round(s.height || 720), 720) & ~1 | 1;
        if (w < 160) w = 161; if (h < 90) h = 91;
        const codec = await pickVideoCodec(w, h);
        if (!codec) { teardownScreenLocal(); alert('Нет поддерживаемого видео-кодека'); return; }
        scrCodec = codec; scrW = w; scrH = h;
        const sig = { type: 'screen_start', call_id: callId, codec, width: w, height: h };
        if (roomId != null) sig.room_id = roomId; else sig.to_id = peerId;
        callSig(sig);
        setupScreenEncoder(codec, w, h);
        if (window.MediaStreamTrackProcessor) {
          try {
            const proc = new MediaStreamTrackProcessor({ track: scrTrack });
            const reader = proc.readable.getReader();
            scrProcessing = true;
            void (async () => {
              for (;;) {
                const r = await reader.read();
                if (r.done || !r.value) break;
                if (!scrProcessing) { r.value.close(); break; }
                encodeScreenFrame(r.value);
              }
            })();
            return;
          } catch (e) {}
        }
        const v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.autoplay = true;
        v.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;';
        v.srcObject = stream;
        document.body.appendChild(v);
        scrVideo = v;
        const tick = () => {
          if (!scrVideo || !v.videoWidth) { try { v.requestVideoFrameCallback(tick); } catch (e) {} return; }
          encodeScreenFrame(new VideoFrame(v, { timestamp: performance.now() * 1000 }));
          if (scrVideo === v) try { v.requestVideoFrameCallback(tick); } catch (e) {}
        };
        v.requestVideoFrameCallback(tick);
      } catch (e) {
        teardownScreenLocal();
        alert('Захват экрана запрещён');
      }
    }
    function teardownScreenLocal() {
      scrProcessing = false;
      try { if (scrStream) scrStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      scrStream = null; scrTrack = null;
      try { if (scrVideo) { scrVideo.srcObject = null; scrVideo.remove(); } } catch (e) {}
      scrVideo = null;
      try { if (scrEnc) scrEnc.close(); } catch (e) {}
      scrEnc = null;
    }
    function stopScreenShareLocal() {
      if ((scrTrack || scrStream) && callId) {
        const sig = { type: 'screen_stop', call_id: callId };
        if (roomId != null) sig.room_id = roomId; else sig.to_id = peerId;
        callSig(sig);
      }
      teardownScreenLocal();
    }
    function ensureScreenDecoder(codec) {
      if (scrDec) { try { scrDec.close(); } catch (e) {} }
      scrDec = new VideoDecoder({
        output: frame => {
          try {
            const el = screenCanvas();
            if (!el || callState !== 'active') { frame.close(); return; }
            const w = frame.displayWidth || frame.codedWidth, h = frame.displayHeight || frame.codedHeight;
            if (el.width !== w) el.width = w;
            if (el.height !== h) el.height = h;
            const g = el.getContext('2d');
            if (g) g.drawImage(frame, 0, 0, w, h);
          } catch (e) {}
          try { frame.close(); } catch (e) {}
        },
        error: () => {},
      });
      scrDec.configure({ codec });
    }
    function stopScreenReceive() {
      scrFrom = null;
      try { if (scrDec) scrDec.close(); } catch (e) {}
      scrDec = null;
      const c = screenCanvas();
      if (c) { const g = c.getContext('2d'); if (g) g.clearRect(0, 0, c.width, c.height); }
    }

    // ---- signaling (тот же протокол, что у нативного клиента) ----
    function handleCallSignal(data) {
      const from = data.from_id;
      if (from == null || from === me.id) return;   // сервер релеит и отправителю
      const tpe = data.type;
      const evRoom = data.room_id != null ? Number(data.room_id) : null;

      // ---------- голосовой канал комнаты (room_id без to_id) ----------
      if (evRoom != null && data.to_id == null) {
        if (tpe === 'call') {
          // анонс: кто-то вошёл в канал комнаты
          if (roomId === evRoom && (callState === 'active' || callState === 'connecting')) {
            addParticipant(from); // присутствие: анонс = он уже в канале
            return;
          }
          if (callState === 'idle' || callState === 'ended') {
            clearEnd();
            roomId = evRoom;
            callId = data.call_id || null;
            inviterId = from;
            peerId = null;
            muted = false;
            participants = [{ id: from, screen: false }];
            callState = 'incoming';
            showChannelInvite(userName(from));
          }
          // заняты другим звонком — игнорируем (канал без нас)
          return;
        }
        if (tpe === 'call_answer') {
          if (roomId !== evRoom) return;
          if (callState === 'active' || callState === 'connecting') addParticipant(from);
          return;
        }
        if (tpe === 'call_audio') {
          if (roomId !== evRoom || !data.audio || callId !== data.call_id) return;
          if (callState !== 'active' && callState !== 'connecting') return;
          addParticipant(from); // догоняем участника, чей анонс могли пропустить
          const r = ensureRemote(from);
          if (!r.dec || r.dec.state !== 'configured') return;
          try {
            const chunk = new EncodedAudioChunk({ type: 'key', timestamp: (data.seq || 0) * 20000, data: b64dec(data.audio) });
            r.dec.decode(chunk);
          } catch (e) {}
          return;
        }
        if (tpe === 'call_hangup') {
          if (roomId !== evRoom) return;
          if (callState === 'incoming' && inviterId === from) { endCall(false, t('call_cancelled')); return; }
          removeParticipant(from);
          return;
        }
        if (tpe === 'screen_start') {
          if (roomId !== evRoom || callId !== data.call_id) return;
          if (callState !== 'active') return;
          scrFrom = from;
          ensureScreenDecoder(data.codec || 'vp8');
          showScreenBox(true);
          return;
        }
        if (tpe === 'screen_frame') {
          if (roomId !== evRoom || !data.data || callId !== data.call_id) return;
          if (callState !== 'active' || from !== scrFrom) return;
          if (!scrDec || scrDec.state !== 'configured') return;
          if (scrDec.decodeQueueSize > 3) return;
          try {
            const chunk = new EncodedVideoChunk({ type: data.key ? 'key' : 'delta', timestamp: (data.seq || 0) * 1000, data: b64dec(data.data) });
            scrDec.decode(chunk);
          } catch (e) {}
          return;
        }
        if (tpe === 'screen_stop') {
          if (roomId !== evRoom) return;
          if (from !== scrFrom) return;
          stopScreenReceive();
          hideScreenBox();
          scrFrom = null;
          setParticipantScreen(from, false);
          return;
        }
        return;
      }

      if (tpe === 'call') {
        if (callState !== 'idle' && callState !== 'ended') {
          // заняты — автоотбой, как в десктопе
          callSig({ type: 'call_hangup', to_id: from, call_id: data.call_id || null, reason: 'busy' });
          return;
        }
        clearEnd();
        peerId = from;
        roomId = null;
        inviterId = null;
        participants = [];
        callId = data.call_id || null;
        muted = false;
        callState = 'incoming';
        showCallIncoming(userName(from));
        clearRing();
        ringTimer = setTimeout(() => { if (callState === 'incoming') endCall(false, t('call_missed')); }, RING_MS);
        return;
      }

      if (tpe === 'call_answer') {
        if (from !== peerId || callId !== data.call_id) return;
        if (callState === 'connecting' || callState === 'outgoing') {
          clearRing();
          callState = 'active';
          showCallActive(t('call_active_label') + esc(userName(peerId)), true);
        }
        return;
      }

      if (tpe === 'call_audio') {
        if (from !== peerId || !data.audio || callId !== data.call_id) return;
        if (callState !== 'active') return;
        const r = ensureRemote(from);
        if (!r.dec || r.dec.state !== 'configured') return;
        try {
          const chunk = new EncodedAudioChunk({ type: 'key', timestamp: (data.seq || 0) * 20000, data: b64dec(data.audio) });
          r.dec.decode(chunk);
        } catch (e) {}
        return;
      }

      if (tpe === 'call_hangup') {
        if (from !== peerId) return;
        let reason = t('call_ended');
        if (data.reason === 'busy') reason = t('call_busy');
        else if (data.reason === 'declined') reason = t('call_declined');
        else if (data.reason === 'mic') reason = t('call_no_mic');
        else if (callState === 'outgoing' || callState === 'incoming' || callState === 'connecting') reason = t('call_cancelled');
        endCall(false, reason);
        return;
      }

      if (tpe === 'screen_start') {
        if (from !== peerId || callId !== data.call_id) return;
        ensureScreenDecoder(data.codec || 'vp8');
        showScreenBox(true);
        return;
      }
      if (tpe === 'screen_frame') {
        if (from !== peerId || !data.data || callId !== data.call_id) return;
        if (callState !== 'active' || !scrDec || scrDec.state !== 'configured') return;
        if (scrDec.decodeQueueSize > 3) return;
        try {
          const chunk = new EncodedVideoChunk({ type: data.key ? 'key' : 'delta', timestamp: (data.seq || 0) * 1000, data: b64dec(data.data) });
          scrDec.decode(chunk);
        } catch (e) {}
        return;
      }
      if (tpe === 'screen_stop') {
        if (from !== peerId) return;
        stopScreenReceive();
        hideScreenBox();
        return;
      }
    }

    // taskbar clock
    function tickClock() {
      const d = new Date();
      $('#tb-clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    tickClock();
    setInterval(tickClock, 10000);

    // log out from taskbar
    $('#start-btn').addEventListener('click', () => {
      store.clear();
      location.reload();
    });
  // ============================================================
  </script>
</body>
</html>
