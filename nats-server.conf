# nats-server: транспорт для клиентов Nekochat (Phase 1).
# Публичный вход: wss://nekochat.komdu.is-cool.dev/nats — ingress-правило в дашборде
# Cloudflare маршрутизирует путь /nats на localhost:8081. TLS терминирует cloudflared,
# поэтому здесь no_tls.
#
# Внутренний вход (app-мост): nats://localhost:4222 — наружу не пробрасывается.

port: 4222            # внутренний вход для app-моста
monitor_port: 8222    # /varz /connz — диагностика (наружу не торчит)

# Сервер пингует клиентов каждые 10с — держит WS-соединение живым против
# idle-резака (~125с) Cloudflare-туннеля. 2 пропущенных пинга -> nats-server
# сам выкидывает мёртвый клиент (протокольный half-open guard).
ping_interval: 10s
ping_max: 2

websocket {
  port: 8081
  no_tls: true
  # Origin-проверку не включаем: браузеры шлют Origin, nats.java/nats-py — нет.
  # same_origin: false (по умолчанию) — принимаем любой Origin/Host за туннелем.
}

authorization {
  users = [
    { user: $NATS_WS_USER, password: $NATS_WS_PASS }
  ]
}