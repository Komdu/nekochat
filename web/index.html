<!DOCTYPE html>
<html lang="ru" data-theme="oled" data-mode="dark" data-lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>nekochat</title>
    <meta name="description" content="Nekochat: комнаты, личные сообщения, голосовые звонки и демонстрация экрана." />

    <!-- Пути к файлам из public/ пишем с ведущим слешем: тогда Vite
         перепишет их с префиксом сборки (base) и они не сломаются при
         открытии адреса без завершающего /. Корневые пути к файлам,
         которых нет в public/, наоборот остаются нетронутыми — так
         подключается /fonts/fonts.css. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nekochat" />

    <!-- Шрифты лежат в app/static/fonts и раздаются сервером от корня,
         поэтому путь здесь абсолютный и переписывать его нельзя. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <script>
      // Тему применяем до первой отрисовки — иначе мигнёт светлым.
      (function () {
        try {
          var v = localStorage.getItem("nk_theme") || "oled";
          if (/^standard-/.test(v)) v = v.replace("standard-", "material-");
          if (v === "material") v = "material-dark";
          if (!/^(win98|material|oled)-(light|dark)$/.test(v)) v = "oled";
          var p = v.split("-");
          document.documentElement.dataset.theme = p[0];
          document.documentElement.dataset.mode = p[1];
        } catch (e) {
          document.documentElement.dataset.theme = "oled";
          document.documentElement.dataset.mode = "dark";
        }
        try {
          var l = localStorage.getItem("nk_lang");
          document.documentElement.dataset.lang = l === "ru" || l === "en" ? l : "ru";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
